<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليرتنا - محول العملات السورية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
        :root {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc; /* light mode background */
        }
        .dark body {
            background-color: #0f172a; /* dark mode background */
        }
        [dir="rtl"] {
            font-family: 'Tajawal', sans-serif;
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .shake {
          animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
        }

        #preloader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #currency-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0; /* Behind React content which has z-10 */
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), 0 0 40px rgba(16, 185, 129, 0.2), inset 0 0 15px rgba(16, 185, 129, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(16, 185, 129, 0.7), 0 0 80px rgba(16, 185, 129, 0.4), inset 0 0 20px rgba(16, 185, 129, 0.5);
            }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="text-slate-900 selection:bg-emerald-100 selection:text-emerald-900 overflow-x-hidden">
    <div id="preloader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-500 ease-in-out" style="font-family: 'Tajawal', sans-serif;">
        <div class="w-32 h-32 mb-8 flex items-center justify-center rounded-full bg-emerald-500/10" style="animation: pulse-glow 3s infinite ease-in-out;">
            <img id="preloader-custom-img" class="hidden max-w-full max-h-full rounded-full" alt="Loading Logo" />
            <div id="preloader-default-letter" class="flex items-center justify-center text-emerald-400 font-black text-6xl" style="animation: breathe 3s infinite ease-in-out; text-shadow: 0 0 15px rgba(16, 185, 129, 0.5);">L</div>
        </div>
        <p class="text-lg font-bold tracking-widest animate-pulse">جاري تحميل ليرتنا...</p>
        <div class="absolute bottom-10 text-xs text-slate-500">
            <p>دليلك الموثوق للعملة السورية</p>
        </div>
    </div>
    <div id="currency-background"></div>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/currency-background.js"></script>
    <script>
      // Initialize the background animation once the DOM is ready.
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof CURRENCY_BG === 'function') {
          CURRENCY_BG({ el: "#currency-background" });
        }
      });
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
