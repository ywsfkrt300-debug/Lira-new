    <script>
      function loadScript(src, callback) {
        const script = document.createElement('script');
        script.src = src;
        script.async = true; // Async loading for speed
        script.onload = callback;
        script.onerror = () => console.error(`Failed to load script: ${src}`);
        document.body.appendChild(script);
      }

      document.addEventListener('DOMContentLoaded', function() {
        const bgEl = document.getElementById('currency-background');
        if (localStorage.getItem('liratna_bg_animation') === 'true') {
          bgEl.classList.remove('hidden');
          
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function() {
            loadScript('/currency-background.js', function() {
              if (typeof CURRENCY_BG === 'function') {
                CURRENCY_BG({ el: "#currency-background" });
              }
            });
          });
        } else {
          bgEl.classList.add('hidden');
        }
      });
    </script>
