<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليرتنا - محول العملات السورية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
        :root {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8fafc; /* light mode background */
        }
        .dark body {
            background-color: #0f172a; /* dark mode background */
        }
        [dir="rtl"] {
            font-family: 'Tajawal', sans-serif;
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .shake {
          animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
        }

        #preloader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .background-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
        }
        
        .background-shapes div {
            position: absolute;
            display: block;
            list-style: none;
            animation: animate-shapes 25s linear infinite;
            bottom: -200px;
        }
        
        .circle {
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
        }
        .dark .circle {
            background: rgba(16, 185, 129, 0.15);
        }

        .triangle {
            width: 0;
            height: 0;
            background: transparent;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 50px solid rgba(16, 185, 129, 0.1);
        }
        .dark .triangle {
            border-bottom-color: rgba(16, 185, 129, 0.15);
        }

        .background-shapes .circle:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .background-shapes .circle:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .background-shapes .circle:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .background-shapes .circle:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .background-shapes .circle:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }

        .background-shapes .triangle:nth-child(6) { left: 75%; animation-delay: 1s; }
        .background-shapes .triangle:nth-child(7) { left: 35%; animation-delay: 2s; animation-duration: 15s; }
        .background-shapes .triangle:nth-child(8) { left: 50%; animation-delay: 5s; }
        .background-shapes .triangle:nth-child(9) { left: 85%; animation-delay: 3s; animation-duration: 22s; }
        .background-shapes .triangle:nth-child(10) { left: 15%; animation-delay: 7s; }
        .background-shapes .triangle:nth-child(11) { left: 90%; animation-delay: 8s; }
        .background-shapes .triangle:nth-child(12) { left: 5%; animation-delay: 4s; animation-duration: 14s; }
        .background-shapes .triangle:nth-child(13) { left: 30%; animation-delay: 9s; }
        .background-shapes .triangle:nth-child(14) { left: 55%; animation-delay: 6s; }
        .background-shapes .triangle:nth-child(15) { left: 80%; animation-delay: 10s; animation-duration: 20s; }
        .background-shapes .triangle:nth-child(16) { left: 45%; animation-delay: 1s; }
        .background-shapes .triangle:nth-child(17) { left: 20%; animation-delay: 11s; }
        .background-shapes .triangle:nth-child(18) { left: 60%; animation-delay: 12s; animation-duration: 17s; }
        .background-shapes .triangle:nth-child(19) { left: 95%; animation-delay: 7s; }
        .background-shapes .triangle:nth-child(20) { left: 28%; animation-delay: 13s; }
        .background-shapes .triangle:nth-child(21) { left: 78%; animation-delay: 8s; animation-duration: 19s; }
        .background-shapes .triangle:nth-child(22) { left: 38%; animation-delay: 5s; }
        .background-shapes .triangle:nth-child(23) { left: 68%; animation-delay: 14s; }
        .background-shapes .triangle:nth-child(24) { left: 88%; animation-delay: 9s; animation-duration: 23s; }
        .background-shapes .triangle:nth-child(25) { left: 18%; animation-delay: 6s; }
        .background-shapes .triangle:nth-child(26) { left: 48%; animation-delay: 15s; }
        .background-shapes .triangle:nth-child(27) { left: 58%; animation-delay: 2s; }
        
        @keyframes animate-shapes {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(720deg); opacity: 0; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"

}
</script>
</head>
<body class="text-slate-900 selection:bg-emerald-100 selection:text-emerald-900 overflow-x-hidden">
    <div id="preloader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-500 ease-in-out" style="font-family: 'Tajawal', sans-serif;">
        <div class="relative w-24 h-24 mb-8 flex items-center justify-center">
            <div class="absolute inset-0 border-4 border-emerald-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-t-emerald-500 rounded-full animate-spin"></div>
            <img id="preloader-custom-img" class="hidden max-w-full max-h-full rounded-full" alt="Loading Logo" />
            <div id="preloader-default-letter" class="flex items-center justify-center text-emerald-500 font-black text-4xl">L</div>
        </div>
        <p class="text-lg font-bold tracking-widest animate-pulse">جاري تحميل ليرتنا...</p>
        <div class="absolute bottom-10 text-xs text-slate-500">
            <p>دليلك الموثوق للعملة السورية</p>
        </div>
    </div>
    <div class="background-shapes">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
        <div class="triangle"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
